# Weekly EIA ingest → attest → anchor → deploy.
#
# WPSR releases Wednesdays ~10:30 ET; we ingest Wednesday evening UTC with a
# Friday catch-up for holiday-delayed releases. If the data changed, the job
# re-anchors the dataset manifest on Solana and pushes the new dataset +
# anchor history to main. The Wednesday run anchors even when nothing
# changed, so the oracle carries a fresh weekly commitment regardless of
# release timing (a same-digest anchor is a heartbeat, not a new version). The push uses GITHUB_TOKEN, which does NOT trigger
# other workflows — deploy-geom.yml therefore also listens for this
# workflow's completion via workflow_run.
#
# Secrets: EIA_API_KEY (eia.gov key), ORACLE_SIGNER_KEY (Solana secret key).
# Optional repo variable: SOLANA_CLUSTER (defaults to devnet until launch).
name: EIA weekly ingest

on:
  schedule:
    - cron: "30 21 * * 3" # Wed 21:30 UTC — after the WPSR release
    - cron: "0 12 * * 5"  # Fri 12:00 UTC — catch-up for delayed releases
  workflow_dispatch:
    inputs:
      force_anchor:
        description: "Anchor even if datasets are unchanged (e.g. cluster cutover, key rotation)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: eia-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Environment hook for the signer secret: move ORACLE_SIGNER_KEY from
    # repo-level secrets into this environment (Settings → Environments →
    # oracle) and add protection rules; repo-level secrets keep working
    # meanwhile, so this is a no-op until the secret is moved.
    environment: oracle
    steps:
      # Third-party actions pinned by commit SHA — a hijacked version tag
      # cannot ship new code into the job that handles the signer key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 24 ships npm 11 — must match the npm generation that wrote
          # package-lock.json, or `npm ci` rejects nested optional deps.
          node-version: 24
          cache: npm

      # --ignore-scripts: no dependency lifecycle script executes on this
      # runner, closing the classic npm-postinstall secret-theft vector.
      # The ingest/anchor scripts run tsx on pure-JS deps and need no
      # native builds.
      - run: npm ci --ignore-scripts

      - name: Ingest EIA WPSR series
        run: npm run ingest:eia
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

      - name: Ingest EIA daily spot prices
        run: npm run ingest:spots
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}

      - name: Detect dataset change
        id: diff
        run: echo "changed=$(git status --porcelain src/data | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Anchor manifest on Solana
        if: steps.diff.outputs.changed != '0' || inputs.force_anchor || github.event.schedule == '30 21 * * 3'
        run: npm run anchor
        env:
          ORACLE_SIGNER_KEY: ${{ secrets.ORACLE_SIGNER_KEY }}
          SOLANA_CLUSTER: ${{ vars.SOLANA_CLUSTER || 'devnet' }}

      - name: Commit and push
        if: steps.diff.outputs.changed != '0' || inputs.force_anchor || github.event.schedule == '30 21 * * 3'
        run: |
          git config user.name "geom-oracle-bot"
          git config user.email "geom-oracle-bot@users.noreply.github.com"
          # Whole data dir: the anchor commits to every dataset, so a
          # partial add would ship a manifest mismatch.
          git add src/data
          if [ "${{ steps.diff.outputs.changed }}" != "0" ]; then
            git commit -m "EIA WPSR ingest: week ending $(node -p "require('./src/data/eia.json').meta.version")"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            git commit -m "Weekly heartbeat anchor (no dataset change)"
          else
            git commit -m "Re-anchor manifest (forced dispatch, no dataset change)"
          fi
          # main may have moved since checkout — never force, always rebase.
          git pull --rebase origin main
          git push

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "EIA ingest failed ($(date -u +%F))" \
            --body "The scheduled EIA ingest/anchor run failed. The oracle stops updating until this is fixed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "issue creation failed; check run logs"
